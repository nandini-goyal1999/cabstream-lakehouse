[project]
name = "triplake"
version = "0.1.0"
description = "PySpark batch lakehouse over NYC TLC trip records: bronze -> silver -> gold"
readme = "README.md"
authors = [{ name = "Nandini Goyal" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyspark==3.5.3",
    "pyarrow>=15.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
