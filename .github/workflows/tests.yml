name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PySpark needs a JVM. Spark 3.5 supports Java 8/11/17; 17 matches local dev.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      # The suite never touches the lake or the network: every test builds its
      # own data from tests/fixtures.py or a tmp_path, so CI does not download
      # the 1.3 GB of TLC source files.
      - name: Run tests
        run: uv run pytest tests/ -q
